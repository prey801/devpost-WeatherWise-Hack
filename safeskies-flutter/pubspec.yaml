name: safeskies
description: "SafeSkies - Real-time weather alerts and hazard crowdsourcing for rural East Africa"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.0.0
  http: ^1.2.0
  sqflite: ^2.3.0
  geolocator: ^11.0.0
  firebase_messaging: ^14.0.0
  connectivity_plus: ^5.0.0
  fl_chart: ^0.68.0
  provider: ^6.1.0
  latlong2: ^0.9.0
  flutter_local_notifications: ^16.0.0
  firebase_core: ^25.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
